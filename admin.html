<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタッフ管理アプリ - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 15px; color: #333; }
    h1 { text-align: center; color: #e65100; font-size: 22px; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: bold; margin: 20px 0 10px; color: #444; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    .info { font-size: 16px; }
    .info .num { font-size: 22px; font-weight: bold; color: #e65100; }
    .info .sub { font-size: 14px; color: #666; margin-top: 4px; }
    .btn { padding: 10px 18px; font-size: 16px; font-weight: bold; color: white; background-color: #e65100; border: none; border-radius: 6px; cursor: pointer; }
    .btn:active { background-color: #cc4800; }
    .btn-complete { background-color: #2e7d32; }
    .btn-complete:active { background-color: #1b5e20; }
    .empty { text-align: center; color: #888; font-size: 15px; padding: 20px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>楊國福 川崎店 スタッフ管理</h1>

  <!-- 待ち組リスト -->
  <div class="section-title">⏳ 待ちのお客様</div>
  <div id="waitlist-container">
    <div class="empty">読み込み中...</div>
  </div>

  <!-- 呼出中リスト（案内済みボタン付き） -->
  <div class="section-title">📢 呼出中のお客様</div>
  <div id="calling-container">
    <div class="empty">現在呼び出し中の方はいません</div>
  </div>

  <script>
    // ⚠️ご自身のGASのURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";

    // 3秒に1回、自動で最新のリストを取得
    setInterval(loadData, 3000);
    window.onload = loadData;

    async function loadData() {
      try {
        // 待ちリストと呼出中リストを同時に取得
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getAllLists' }) // または個別に取得
        });
        
        // シンプルに別々に取得する安全な設計にします
        loadWaitlist();
        loadCallinglist();
      } catch (error) {
        console.error("データ取得エラー:", error);
      }
    }

    async function loadWaitlist() {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getWaitlist' })
        });
        const result = await response.json();
        const waitlist = result.waitlist || [];
        const container = document.getElementById('waitlist-container');

        if (waitlist.length > 0) {
          container.innerHTML = "";
          waitlist.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="info">
                <span class="num">${item.ticketNo} 番</span> (${item.people}名様)<br>
                <span class="sub">${item.name} ／ 受付: ${item.time}</span>
              </div>
              <button class="btn" onclick="callUser(${item.ticketNo})">呼び出す</button>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = `<div class="empty">現在待ちのお客様はいません</div>`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadCallinglist() {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getCallingList' })
        });
        const result = await response.json();
        const callingList = result.callingList || [];
        const container = document.getElementById('calling-container');

        if (callingList.length > 0) {
          container.innerHTML = "";
          callingList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="info">
                <span class="num" style="color: #2e7d32;">${item.ticketNo} 番</span> (${item.people}名様)<br>
                <span class="sub">${item.name}</span>
              </div>
              <button class="btn btn-complete" onclick="completeUser(${item.ticketNo})">案内済み</button>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = `<div class="empty">現在呼び出し中の方はいません</div>`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 呼び出しボタンを押したとき
    async function callUser(ticketNo) {
      if (!confirm(`${ticketNo}番のお客様を呼び出しますか？`)) return;
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'callUser', 'ticketNo': ticketNo })
        });
        const result = await response.json();
        if (result.success) {
          loadData();
        } else {
          alert("エラー: " + result.error);
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      }
    }

    // 案内済みボタンを押したとき（リストから消す）
    async function completeUser(ticketNo) {
      if (!confirm(`${ticketNo}番のお客様の案内を完了（終了）しますか？`)) return;
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'completeUser', 'ticketNo': ticketNo })
        });
        const result = await response.json();
        if (result.success) {
          loadData();
        } else {
          alert("エラー: " + result.error);
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      }
    }
  </script>
</body>
</html>
