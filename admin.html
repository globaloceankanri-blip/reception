<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【スタッフ用】呼び出し管理アプリ</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #eceff1; margin: 0; padding: 0; }
    .header { background-color: #37474f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
    .header h1 { margin: 0; font-size: 18px; }
    .refresh-btn { background-color: #00bcd4; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .refresh-btn:active { background-color: #00acc1; }
    
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    .status-msg { text-align: center; color: #666; margin-top: 20px; font-weight: bold; }
    
    .card { background-color: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #e65100; }
    .card-left { flex-grow: 1; }
    
    .time { font-size: 13px; color: #777; margin-bottom: 4px; }
    .ticket { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 4px; }
    .info { font-size: 15px; color: #555; }
    
    .badge-line { background-color: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #c8e6c9; margin-left: 5px; vertical-align: middle;}
    .badge-paper { background-color: #fff3e0; color: #e65100; font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffe0b2; margin-left: 5px; vertical-align: middle;}
    
    .call-btn { background-color: #e65100; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; min-width: 100px; text-align: center; }
    .call-btn:active { background-color: #cc4800; }
    .call-btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>順番待ち呼び出しアプリ</h1>
    <button class="refresh-btn" onclick="fetchWaitlist()">🔄 更新</button>
  </div>

  <div class="container">
    <div id="loading" class="status-msg">リストを読み込んでいます...</div>
    <div id="list-container"></div>
  </div>

  <script>
    // ⚠️【必須変更箇所】あなたのGASのURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    // 画面を開いたときにリストを取得
    window.onload = fetchWaitlist;

    async function fetchWaitlist() {
      const container = document.getElementById('list-container');
      const loading = document.getElementById('loading');
      
      container.innerHTML = "";
      loading.style.display = 'block';
      loading.innerText = "リストを読み込んでいます...";

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getWaitlist' })
        });
        const result = await response.json();
        
        loading.style.display = 'none';

        if (result.waitlist && result.waitlist.length > 0) {
          result.waitlist.forEach(item => {
            container.appendChild(createCard(item));
          });
        } else {
          loading.style.display = 'block';
          loading.innerText = "現在、お待ちのお客様はいません。";
        }
      } catch (error) {
        console.error("Error:", error);
        loading.innerText = "エラーが発生しました。更新ボタンを押してください。";
      }
    }

    function createCard(item) {
      const isLine = item.lineId !== "iPad店頭（紙）";
      const badgeHtml = isLine 
        ? `<span class="badge-line">LINE受付</span>` 
        : `<span class="badge-paper">店頭(紙)</span>`;
      
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${item.ticketNo}`;
      
      card.innerHTML = `
        <div class="card-left">
          <div class="time">受付: ${item.time}</div>
          <div class="ticket">${item.ticketNo} 番 ${badgeHtml}</div>
          <div class="info">${isLine ? item.name : '店頭のお客様'} / ${item.people}名</div>
        </div>
        <button class="call-btn" onclick="callUser('${item.ticketNo}', this, ${isLine})">呼び出す</button>
      `;
      return card;
    }

    async function callUser(ticketNo, btnElement, isLine) {
      if(!confirm(`${ticketNo}番のお客様を呼び出しますか？`)) return;

      btnElement.disabled = true;
      btnElement.innerText = "処理中...";

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'callUser', 'ticketNo': ticketNo })
        });
        const result = await response.json();
        
        if (result.success) {
          // 呼び出し成功したらカードの色を変えてフェードアウト
          const card = document.getElementById(`card-${ticketNo}`);
          card.style.opacity = "0.5";
          btnElement.innerText = "呼出済";
          
          if(!isLine) {
            alert(`【${ticketNo}番は紙発券のお客様です】\n店頭にて口頭でお呼び出しをお願いします！`);
          }
        } else {
          alert("エラー: " + result.error);
          btnElement.disabled = false;
          btnElement.innerText = "呼び出す";
        }
      } catch (error) {
        alert("通信エラーが発生しました。");
        btnElement.disabled = false;
        btnElement.innerText = "呼び出す";
      }
    }
  </script>
</body>
</html>
