<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>店頭受付 - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fff3e0; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation;}
    .container { background-color: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
    .logo-img { display: block; margin: 0 auto 15px; width: 120px; height: auto; border-radius: 50%; }
    h1 { text-align: center; color: #e65100; font-size: 26px; margin-top: 0; margin-bottom: 30px; line-height: 1.4; }
    .form-group { margin-bottom: 30px; }
    label { display: block; font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; text-align: center; }
    input[type="number"] { width: 100%; padding: 15px; font-size: 28px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; text-align: center; }
    .btn { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; color: white; background-color: #e65100; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
    .btn:active { background-color: #cc4800; }
    #loading { display: none; text-align: center; font-size: 18px; color: #e65100; margin-top: 15px; font-weight: bold;}
    .notice { text-align: center; color: #666; font-size: 14px; margin-top: 25px; }

    /* 印刷専用のデザイン（普段は非表示、印刷時だけ紙のサイズで出現） */
    #print-area { display: none; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; text-align: center; font-family: sans-serif; padding: 10px; color: #000; }
      .p-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
      .p-sub { font-size: 16px; margin-bottom: 15px; }
      .p-ticket { font-size: 45px; font-weight: bold; margin: 15px 0; }
      .p-info { font-size: 16px; text-align: left; padding-left: 10%; margin: 15px 0; line-height: 1.5; }
      .p-notice { font-size: 14px; line-height: 1.4; margin-top: 15px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="楊國福ロゴ" class="logo-img">
    <h1>楊國福 川崎店<br>順番待ち店頭受付</h1>
    
    <div class="form-group">
      <label for="people">ご来店人数を入力してください</label>
      <input type="number" id="people" min="1" pattern="\d*" placeholder="例: 2">
    </div>
    
    <button class="btn" id="submitBtn" onclick="issueTicket()">整理券を発行する</button>
    <div id="loading">受付処理中...</div>
    
    <div class="notice">※LINEをご利用でないお客様専用です</div>
  </div>

  <!-- 印刷用エリア -->
  <div id="print-area">
    <div class="p-title">楊國福 川崎店</div>
    <div class="p-sub">― 順番受付整理券 ―</div>
    <hr style="border-top: 1px dashed #000;">
    <div style="font-size: 14px; margin-top: 10px;">あなたの受付番号</div>
    <div class="p-ticket" id="p-ticket-no">1 番</div>
    <hr style="border-top: 1px dashed #000;">
    <div class="p-info" id="p-info-text">
      受付日時 : 2026/08/30 19:00<br>
      ご人数   : 2名
    </div>
    <div class="p-notice">
      順番が来ましたら番号でお呼びします。<br>
      店舗付近でお待ちください。<br><br>
      ※お呼び出し時にご不在の場合は<br>
      キャンセルとなる場合がございます。
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    async function issueTicket() {
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const peopleVal = document.getElementById('people').value;
      
      if (!peopleVal || peopleVal < 1) {
        alert("人数を正しく入力してください。");
        return;
      }
      
      btn.disabled = true;
      loading.style.display = 'block';

      const now = new Date();
      const timeStr = now.getFullYear() + "/" + 
                      String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                      String(now.getDate()).padStart(2, '0') + " " + 
                      String(now.getHours()).padStart(2, '0') + ":" + 
                      String(now.getMinutes()).padStart(2, '0');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'action': 'registerIpad', 
            'name': '店頭受付のお客様',
            'adult': peopleVal,
            'child': '0',
            'time': timeStr
          })
        });

        const result = await response.json();
        const ticketNo = result.ticketNo;

        if (ticketNo) {
           // 印刷用の文字をセット
           document.getElementById('p-ticket-no').innerText = ticketNo + " 番";
           document.getElementById('p-info-text').innerHTML = `受付日時 : ${timeStr}<br>ご人数   : ${peopleVal}名`;

           // スプレッドシートへの登録完了後、iPadの印刷画面を直接呼び出す
           setTimeout(() => {
             window.print();
           }, 500);

        } else {
           alert("受付番号の取得に失敗しました。");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("通信エラーが発生しました。もう一度お試しください。");
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
        document.getElementById('people').value = ""; 
      }
    }
  </script>
</body>
</html>
