<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>店頭受付 - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fff3e0; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation;}
    .container { background-color: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
    .logo-img { display: block; margin: 0 auto 15px; width: 120px; height: auto; border-radius: 50%; }
    h1 { text-align: center; color: #e65100; font-size: 26px; margin-top: 0; margin-bottom: 30px; line-height: 1.4; }
    .form-group { margin-bottom: 30px; }
    label { display: block; font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; text-align: center; }
    input[type="number"] { width: 100%; padding: 15px; font-size: 28px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; text-align: center; }
    .btn { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; color: white; background-color: #e65100; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
    .btn:active { background-color: #cc4800; }
    #loading { display: none; text-align: center; font-size: 18px; color: #e65100; margin-top: 15px; font-weight: bold;}
    .notice { text-align: center; color: #666; font-size: 14px; margin-top: 25px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="楊國福ロゴ" class="logo-img">
    <h1>楊國福 川崎店<br>順番待ち店頭受付</h1>
    
    <div class="form-group">
      <label for="people">ご来店人数を入力してください</label>
      <input type="number" id="people" min="1" pattern="\d*" placeholder="例: 2">
    </div>
    
    <button class="btn" id="submitBtn" onclick="issueTicket()">整理券を発行する</button>
    <div id="loading">受付処理中... プリンターへ送信しています</div>
    
    <div class="notice">※LINEをご利用でないお客様専用です</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    async function issueTicket() {
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const peopleVal = document.getElementById('people').value;
      
      if (!peopleVal || peopleVal < 1) {
        alert("人数を正しく入力してください。");
        return;
      }
      
      btn.disabled = true;
      loading.style.display = 'block';

      const now = new Date();
      const timeStr = now.getFullYear() + "/" + 
                      String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                      String(now.getDate()).padStart(2, '0') + " " + 
                      String(now.getHours()).padStart(2, '0') + ":" + 
                      String(now.getMinutes()).padStart(2, '0');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'action': 'registerIpad', 
            'name': '店頭受付のお客様',
            'adult': peopleVal,
            'child': '0',
            'time': timeStr
          })
        });

        const result = await response.json();
        const ticketNo = result.ticketNo;

        if (ticketNo) {
           printReceiptImage(ticketNo, peopleVal, timeStr);
        } else {
           alert("受付番号の取得に失敗しました。");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("通信エラーが発生しました。もう一度お試しください。");
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
        document.getElementById('people').value = ""; 
      }
    }

    function printReceiptImage(ticketNo, people, timeStr) {
      // 画面上でレシートの画像を自動作成する
      const canvas = document.createElement('canvas');
      canvas.width = 576; // mC-Print3の標準幅
      canvas.height = 400;
      const ctx = canvas.getContext('2d');

      // 背景を白に
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 文字を描画
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";

      ctx.font = "bold 28px sans-serif";
      ctx.fillText("楊國福 川崎店", canvas.width / 2, 45);

      ctx.font = "20px sans-serif";
      ctx.fillText("― 順番受付整理券 ―", canvas.width / 2, 80);

      ctx.font = "16px sans-serif";
      ctx.fillText("----------------------------------------------------------------", canvas.width / 2, 105);

      ctx.font = "18px sans-serif";
      ctx.fillText("あなたの受付番号", canvas.width / 2, 140);

      ctx.font = "bold 55px sans-serif";
      ctx.fillText(ticketNo + " 番", canvas.width / 2, 205);

      ctx.font = "16px sans-serif";
      ctx.fillText("----------------------------------------------------------------", canvas.width / 2, 230);

      ctx.textAlign = "left";
      ctx.font = "18px sans-serif";
      ctx.fillText(" 受付日時 : " + timeStr, 50, 270);
      ctx.fillText(" ご人数   : " + people + "名", 50, 305);

      ctx.textAlign = "center";
      ctx.font = "16px sans-serif";
      ctx.fillText("順番が来ましたら番号でお呼びします。", canvas.width / 2, 350);
      ctx.fillText("店舗付近でお待ちください。", canvas.width / 2, 375);

      // 画像データ（Base64）に変換
      const base64Image = canvas.toDataURL('image/png');

      const backUrl = encodeURIComponent(window.location.href);
      const imgStr = encodeURIComponent(base64Image);
      
      // 画像用の最も安定したPassPRNTコマンド
      const passPrntUrl = `starpassprnt://v1/print/image?back=${backUrl}&image=${imgStr}&papier=true`;

      window.location.href = passPrntUrl;
    }
  </script>
</body>
</html>
