<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>店頭受付 - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fff3e0; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation;}
    .container { background-color: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
    
    /* ロゴ用のスタイルを追加 */
    .logo-img { display: block; margin: 0 auto 15px; width: 120px; height: auto; border-radius: 50%; }
    
    h1 { text-align: center; color: #e65100; font-size: 26px; margin-top: 0; margin-bottom: 30px; line-height: 1.4; }
    .form-group { margin-bottom: 30px; }
    label { display: block; font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; text-align: center; }
    select { width: 100%; padding: 15px; font-size: 22px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; text-align: center; }
    .btn { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; color: white; background-color: #e65100; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
    .btn:active { background-color: #cc4800; }
    #loading { display: none; text-align: center; font-size: 18px; color: #e65100; margin-top: 15px; font-weight: bold;}
    .notice { text-align: center; color: #666; font-size: 14px; margin-top: 25px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 画面の真ん中にロゴを配置 -->
    <img src="logo.png" alt="楊國福ロゴ" class="logo-img">
    
    <h1>楊國福 川崎店<br>順番待ち店頭受付</h1>
    
    <div class="form-group">
      <label for="people">人数</label>
      <select id="people">
        <option value="1">1名</option>
        <option value="2">2名</option>
        <option value="3">3名</option>
        <option value="4">4名</option>
        <option value="5">5名</option>
        <option value="6">6名以上</option>
      </select>
    </div>
    
    <button class="btn" id="submitBtn" onclick="issueTicket()">整理券を発行する</button>
    <div id="loading">受付処理中... プリンターへ送信しています</div>
    
    <div class="notice">※LINEをご利用でないお客様専用です</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    // プリンターが読み込む用のロゴURL（receptionフォルダのlogo.pngを指定）
    const LOGO_URL = "https://globaloceankanri-blip.github.io/reception/logo.png";
    
    async function issueTicket() {
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      
      const peopleVal = document.getElementById('people').value;
      
      btn.disabled = true;
      loading.style.display = 'block';

      const now = new Date();
      const timeStr = now.getFullYear() + "/" + 
                      String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                      String(now.getDate()).padStart(2, '0') + " " + 
                      String(now.getHours()).padStart(2, '0') + ":" + 
                      String(now.getMinutes()).padStart(2, '0');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'action': 'registerIpad', 
            'name': '店頭受付のお客様',
            'adult': peopleVal, // 選択された人数を送信
            'child': '0',       // スプレッドシートのエラー防止のため子供は0で送信
            'time': timeStr
          })
        });

        const result = await response.json();
        const ticketNo = result.ticketNo;

        if (ticketNo) {
           printReceipt(ticketNo, peopleVal, timeStr);
        } else {
           alert("受付番号の取得に失敗しました。");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("通信エラーが発生しました。もう一度お試しください。");
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
        document.getElementById('people').value = "1"; // 初期値に戻す
      }
    }

    function printReceipt(ticketNo, people, timeStr) {
      const receiptText = 
        `[align: center]` +
        `[image: url ${LOGO_URL}; width 40%]\n\n` + 
        `[font: medium][bold: on]楊國福 川崎店[bold: off]\n` +
        `[font: small]― 順番受付整理券 ―\n\n` +
        `--------------------------------\n` +
        `[font: small]あなたの受付番号\n` +
        `[font: large][bold: on] ${ticketNo} 番 [bold: off]\n` +
        `--------------------------------\n\n` +
        `[align: left]` +
        `[font: small]` +
        `  受付日時 : ${timeStr}\n` +
        `  ご人数   : ${people}名\n\n` +  // ★「大人・子供」から「ご人数」に修正済み
        `[align: center]` +
        `順番が来ましたら番号でお呼びします。\n` +
        `店舗付近でお待ちください。\n\n` +
        `※お呼び出し時にご不在の場合は\n` +
        `キャンセルとなる場合がございます。\n\n` +
        `[cut]`;

      const backUrl = encodeURIComponent(window.location.href);
      const pdfStr = encodeURIComponent(receiptText);
      const passPrntUrl = `starpassprnt://v1/print/current?back=${backUrl}&pdf=${pdfStr}&port=BT:mC-Print3`;

      window.location.href = passPrntUrl;
    }
  </script>
</body>
</html>
