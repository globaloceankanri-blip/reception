<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>順番待ち受付 - 楊國福 川崎店</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; }
    .container { background-color: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: 0 auto; box-sizing: border-box;}
    
    .logo-img { display: block; margin: 0 auto 15px; width: 120px; height: auto; border-radius: 50%; }
    
    h1 { text-align: center; color: #e65100; font-size: 24px; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #333; text-align: center;}
    
    input[type="number"] { width: 100%; padding: 15px; font-size: 28px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; text-align: center; }
    
    .btn { width: 100%; padding: 18px; font-size: 20px; font-weight: bold; color: white; background-color: #06C755; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px;}
    .btn:active { background-color: #05a847; }
    
    #loading, #success, #error { display: none; text-align: center; margin-top: 15px; font-weight: bold; }
    #loading { color: #e65100; }
    #success { color: #06C755; }
    #error { color: red; }
    
    #profile-area { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    #profile-name { font-size: 18px; font-weight: bold; color: #333; }
    
    .ticket-display { display: none; text-align: center; padding: 20px; background: #fff3e0; border-radius: 8px; margin-top: 20px;}
    .ticket-display h2 { margin: 0; color: #e65100; font-size: 20px;}
    .ticket-display .number { font-size: 45px; font-weight: bold; color: #333; margin: 15px 0;}
    /* ▼ 待ち組数用のスタイルを追加 */
    .ticket-display .wait-info { font-size: 18px; font-weight: bold; color: #d84315; margin-bottom: 15px; }
    .close-btn { background-color: #666; }
  </style>
</head>
<body>
  <div class="container" id="main-container">
    
    <img src="logo.png" alt="楊國福ロゴ" class="logo-img">
    
    <h1>楊國福 川崎店<br>順番待ち受付</h1>
    
    <div id="profile-area" style="display: none;">
      <div id="profile-name"></div>
    </div>

    <!-- 入力フォーム -->
    <div id="form-area" style="display: none;">
      <div class="form-group">
        <label for="people">ご来店人数を入力してください</label>
        <input type="number" id="people" min="1" pattern="\d*" placeholder="例: 2">
      </div>
      <button class="btn" id="submitBtn" onclick="registerLineQueue()">順番待ちに登録する</button>
    </div>

    <!-- 処理中のメッセージ -->
    <div id="loading">状況を確認しています...</div>
    <div id="success">受付完了しました！</div>
    <div id="error">エラーが発生しました。</div>

    <!-- 完了後の受付番号表示エリア -->
    <div id="ticket-area" class="ticket-display">
      <h2>あなたの受付番号</h2>
      <div class="number" id="display-ticket-no">- 番</div>
      
      <!-- ▼ ここに待ち組数が表示されます -->
      <div class="wait-info" id="display-wait-info"></div>
      
      <p style="font-size: 14px; color: #555; margin-bottom: 20px;">順番が近づきましたら、<br>LINEのメッセージでお知らせします。</p>
      <button class="btn close-btn" onclick="liff.closeWindow()">画面を閉じる</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    const LIFF_ID = "2010495808-71rxBAfN";
    
    let lineProfile = null;

    async function initializeLiff() {
      document.getElementById('loading').style.display = 'block';
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          lineProfile = await liff.getProfile();
          document.getElementById('profile-name').innerText = lineProfile.displayName + " 様";
          document.getElementById('profile-area').style.display = 'block';
          
          checkCurrentStatus(lineProfile.userId);
        } else {
          liff.login();
        }
      } catch (err) {
        console.error('LIFF Initialization failed', err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').innerText = "LINE連携に失敗しました。LINEアプリから再度お試しください。";
        document.getElementById('error').style.display = 'block';
      }
    }

    async function checkCurrentStatus(userId) {
       try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'action': 'checkStatus',
            'lineUserId': userId
          })
        });
        const result = await response.json();
        
        document.getElementById('loading').style.display = 'none';

        if(result.isWaiting) {
           // 待ち組数も一緒に渡す
           showTicket(result.ticketNo, result.waitingAhead);
        } else {
           document.getElementById('form-area').style.display = 'block';
        }
       } catch (error) {
         console.error("Check status error:", error);
         document.getElementById('loading').style.display = 'none';
         document.getElementById('form-area').style.display = 'block'; 
       }
    }

    async function registerLineQueue() {
      if (!lineProfile) {
        alert("LINEの情報が取得できていません。");
        return;
      }

      const btn = document.getElementById('submitBtn');
      const peopleVal = document.getElementById('people').value;
      
      if (!peopleVal || peopleVal < 1) {
        alert("人数を正しく入力してください。");
        return;
      }
      
      btn.disabled = true;
      document.getElementById('loading').innerText = "処理中...";
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';

      const now = new Date();
      const timeStr = now.getFullYear() + "/" + 
                      String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                      String(now.getDate()).padStart(2, '0') + " " + 
                      String(now.getHours()).padStart(2, '0') + ":" + 
                      String(now.getMinutes()).padStart(2, '0');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'action': 'registerLine',
            'name': lineProfile.displayName,
            'lineUserId': lineProfile.userId,
            'adult': peopleVal,
            'child': '0',
            'time': timeStr
          })
        });

        const result = await response.json();
        
        if (result.ticketNo) {
           document.getElementById('loading').style.display = 'none';
           document.getElementById('success').style.display = 'block';
           document.getElementById('form-area').style.display = 'none';
           
           setTimeout(() => {
             document.getElementById('success').style.display = 'none';
             // 待ち組数も一緒に渡す
             showTicket(result.ticketNo, result.waitingAhead);
           }, 1500);

        } else {
           throw new Error("Ticket generation failed");
        }
      } catch (error) {
        console.error("Registration error:", error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        btn.disabled = false;
      }
    }

    // 待ち組数（waitingAhead）を受け取って画面に表示する
    function showTicket(ticketNo, waitingAhead) {
        document.getElementById('display-ticket-no').innerText = ticketNo + " 番";
        
        // 待ち組数が取得できた場合のみ表示
        if (waitingAhead !== undefined) {
          document.getElementById('display-wait-info').innerText = "現在、前に " + waitingAhead + " 組 お待ちです";
        }
        
        document.getElementById('ticket-area').style.display = 'block';
    }

    window.onload = initializeLiff;
  </script>
</body>
</html>
