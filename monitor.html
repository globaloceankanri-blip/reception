<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お呼び出しモニター - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; overflow: hidden; }
    h1 { font-size: 3.5vw; color: #ff9800; margin-bottom: 20px; text-align: center; }
    .container { display: flex; gap: 30px; width: 100%; max-width: 1200px; justify-content: center; flex-wrap: wrap; }
    .card { background-color: #333; border: 4px solid #ff9800; border-radius: 20px; padding: 40px; text-align: center; min-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: pulse 2s infinite; }
    .label { font-size: 2.5vw; color: #ccc; margin-bottom: 10px; }
    .number { font-size: 10vw; font-weight: bold; color: #fff; margin: 0; line-height: 1.2; }
    .sub { font-size: 2vw; color: #ffeb3b; margin-top: 15px; }
    .empty { font-size: 3vw; color: #666; margin-top: 50px; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1.01); } }
  </style>
</head>
<body>

  <h1>楊國福 川崎店 お呼び出し状況</h1>
  
  <div class="container" id="monitor-container">
    <div class="empty">現在、お呼び出し中の番号はありません</div>
  </div>

  <audio id="chime" src="https://actions.google.com/sounds/v1/ambiences/store_door_chime.ogg" preload="auto"></audio>

  <script>
    // ⚠️ご自身のGASのURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    let lastCalledNumbers = "";

    // 3秒に1回、自動でサーバーに確認しに行く
    setInterval(checkCalling, 3000);

    async function checkCalling() {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getCallingList' })
        });
        const result = await response.json();
        
        const container = document.getElementById('monitor-container');
        const callingList = result.callingList || [];

        // 番号の文字列を作って変更があったかチェック
        const currentNumbersStr = callingList.map(item => item.ticketNo).join(',');
        
        if (currentNumbersStr !== lastCalledNumbers && currentNumbersStr !== "") {
          // 新しく呼び出された番号がある場合、チャイムを鳴らす
          document.getElementById('chime').play().catch(e => console.log("音声再生エラー:", e));
        }
        lastCalledNumbers = currentNumbersStr;

        if (callingList.length > 0) {
          container.innerHTML = "";
          callingList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="label">お呼び出し番号</div>
              <div class="number">${item.ticketNo} 番</div>
              <div class="sub">（ ${item.people}名様 ）</div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = `<div class="empty">順番にお呼びしております。店内でお待ちください。</div>`;
        }

      } catch (error) {
        console.error("通信エラー:", error);
      }
    }
  </script>
</body>
</html>
