<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お呼び出しモニター - 楊國福 川崎店</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
    h1 { font-size: 2.5vw; color: #ff9800; margin: 0 0 15px 0; text-align: center; }
    
    /* 全体を左右に分割 */
    .main-layout { display: flex; flex: 1; gap: 20px; width: 100%; max-height: calc(100vh - 80px); }
    
    /* 左側：呼び出し済みリスト（小さめ） */
    .left-pane { flex: 1; background: #222; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; border: 2px solid #444; }
    .left-title { font-size: 1.8vw; color: #aaa; margin-bottom: 15px; text-align: center; border-bottom: 2px solid #444; padding-bottom: 8px; }
    .history-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
    .history-card { background: #333; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #888; }
    .history-num { font-size: 2.2vw; font-weight: bold; }
    .history-sub { font-size: 1.2vw; color: #bbb; }

    /* 右側：最新の呼び出し（一番大きく目立つ） */
    .right-pane { flex: 1.2; background: #2a1f14; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid #ff9800; box-shadow: 0 0 30px rgba(255,152,0,0.3); }
    .right-title { font-size: 2.2vw; color: #ff9800; margin-bottom: 10px; font-weight: bold; }
    .latest-card { text-align: center; width: 100%; }
    .latest-num { font-size: 13vw; font-weight: bold; color: #fff; margin: 0; line-height: 1.1; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }
    .latest-sub { font-size: 2.5vw; color: #ffeb3b; margin-top: 15px; }
    
    .empty-pane { color: #666; font-size: 2vw; text-align: center; margin: auto; }

    #sound-btn { position: fixed; bottom: 15px; right: 15px; background: #ff9800; color: #000; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 9999; }
  </style>
</head>
<body>

  <button id="sound-btn" onclick="enableAudio()">🔊 音声を有効にする（最初に押してください）</button>

  <h1>楊國福 川崎店 お呼び出し状況</h1>
  
  <div class="main-layout">
    <!-- 左側：呼び出し済み（最新以外） -->
    <div class="left-pane">
      <div class="left-title">その他の呼び出し中番号</div>
      <div class="history-list" id="left-list">
        <div class="empty-pane">現在ありません</div>
      </div>
    </div>

    <!-- 右側：最新の呼び出し -->
    <div class="right-pane" id="right-pane">
      <div class="empty-pane">ただいまお呼び出し中の番号はありません</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMskWCJ9HQ3Pk4DlkdIUQX91_PxQbVrB_Q-HYKsLcLu690VDWjo3rhFeSOPvniGwk5/exec";
    
    let lastCalledNumbers = "";
    let isAudioEnabled = false;

    function enableAudio() {
      isAudioEnabled = true;
      document.getElementById('sound-btn').style.display = 'none';
      speakText("音声案内が有効になりました。");
    }

    function speakText(text) {
      if (!isAudioEnabled) return;
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    setInterval(checkCalling, 3000);

    async function checkCalling() {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 'action': 'getCallingList' })
        });
        const result = await response.json();
        const callingList = result.callingList || [];

        const currentNumbersStr = callingList.map(item => item.ticketNo).join(',');
        
        // 【修正】呼び出しが0人から1人目に変わった時も確実に音声が鳴るようにしました
        if (currentNumbersStr !== lastCalledNumbers && currentNumbersStr !== "") {
          
          const oldList = lastCalledNumbers === "" ? [] : lastCalledNumbers.split(',');
          const newList = callingList.map(item => String(item.ticketNo));
          const newlyCalled = newList.filter(no => !oldList.includes(no));
          
          if (newlyCalled.length > 0 && isAudioEnabled) {
            const targetNo = newlyCalled[newlyCalled.length - 1];
            speakText(`お待たせいたしました。受付番号、${targetNo}番のお客様。カウンターまでお越しください。`);
          }
        }
        
        lastCalledNumbers = currentNumbersStr;

        const leftList = document.getElementById('left-list');
        const rightPane = document.getElementById('right-pane');

        if (callingList.length > 0) {
          // 最後に呼ばれた番号（一番新しいもの）を右側に配置
          const latest = callingList[callingList.length - 1];
          rightPane.innerHTML = `
            <div class="right-title">✨ ただいまお呼び出し中 ✨</div>
            <div class="latest-card">
              <div class="latest-num">${latest.ticketNo} 番</div>
              <div class="latest-sub">（ ${latest.people}名様 ）</div>
            </div>
          `;

          // 残りの番号を左側に配置
          if (callingList.length > 1) {
            leftList.innerHTML = "";
            const historyItems = callingList.slice(0, callingList.length - 1).reverse();
            historyItems.forEach(item => {
              const div = document.createElement('div');
              div.className = 'history-card';
              div.innerHTML = `
                <div class="history-num">${item.ticketNo} 番</div>
                <div class="history-sub">（ ${item.people}名様 ）</div>
              `;
              leftList.appendChild(div);
            });
          } else {
            leftList.innerHTML = `<div class="empty-pane">ほかに呼び出し中の番号はありません</div>`;
          }

        } else {
          rightPane.innerHTML = `<div class="empty-pane">ただいまお呼び出し中の番号はありません</div>`;
          leftList.innerHTML = `<div class="empty-pane">現在ありません</div>`;
        }

      } catch (error) {
        console.error("通信エラー:", error);
      }
    }
  </script>
</body>
</html>
